<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FinAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navigation (Simplified for Login) -->
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg"><i class="fa-solid fa-robot text-white text-sm"></i></div>
                    <span class="font-bold text-xl text-slate-900">FinAI</span>
                </a>
                <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-slate-900 transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Form Section -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h1>
                <p class="text-sm text-slate-500">Sign in to access your AI portfolio dashboard.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" placeholder="you@example.com">
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700">Password</label>
                        <a href="#" class="text-xs font-medium text-blue-600 hover:text-blue-700">Forgot password?</a>
                    </div>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-blue-600/20 flex items-center justify-center gap-2">
                    Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wider">Or continue with</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <button type="button" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-3 rounded-xl transition flex items-center justify-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    Sign in with Google
                </button>
            </form>

            <p class="text-center text-sm text-slate-600 mt-8">
                Don't have an account? <a href="#" class="font-semibold text-blue-600 hover:text-blue-700">Create one</a>
            </p>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // For now, we simulate a successful login and redirect to the dashboard
            // Note: Real authentication requires a backend database (like Firebase or Node.js)
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(() => {
                // Save a dummy login state in the browser
                localStorage.setItem('finai_user', email);
                
                // Redirect to Dashboard
                window.location.href = 'dashboard.html';
            }, 1500); // 1.5 second loading effect
        });
    </script>
</body>
</html>
