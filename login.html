<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - FinAI (Firebase Secured)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex bg-blue-600 p-3 rounded-xl shadow-lg shadow-blue-500/30 mb-6"><i class="fa-solid fa-layer-group text-white text-xl"></i></a>
            <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
            <p class="text-slate-500 mt-2">Log in securely with Firebase.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" placeholder="••••••••">
            </div>

            <!-- Error Message Box -->
            <p id="errorMessage" class="text-red-500 text-sm font-medium hidden"></p>

            <button type="submit" id="emailLoginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 mt-4">
                Log In
            </button>
            
            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wider font-semibold">Or continue with</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button type="button" id="googleLoginBtn" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-3">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Sign in with Google
            </button>
        </form>
    </div>

    <!-- Firebase SDKs (Modular v9/v10) -->
    <script type="module">
        // 1. Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 2. YOUR FIREBASE CONFIGURATION (Replace this with your actual config from Firebase Console)
        const firebaseConfig = {
  apiKey: "AIzaSyAQaSmEjMDAwyAUsw-hzjRyDKxb1KRrix4",
  authDomain: "finai-f19c0.firebaseapp.com",
  projectId: "finai-f19c0",
  storageBucket: "finai-f19c0.firebasestorage.app",
  messagingSenderId: "31702327804",
  appId: "1:31702327804:web:c4efad4ac1ffad303b5279",
  measurementId: "G-P2WWVVS448"
};

        // 3. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const errorMessage = document.getElementById('errorMessage');
        const emailLoginBtn = document.getElementById('emailLoginBtn');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        // --- Email & Password Login ---
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            emailLoginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            errorMessage.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Success
                    const user = userCredential.user;
                    localStorage.setItem('finai_user', JSON.stringify({ name: user.email, email: user.email }));
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    // Error
                    emailLoginBtn.innerHTML = 'Log In';
                    errorMessage.innerText = error.message;
                    errorMessage.classList.remove('hidden');
                });
        });

        // --- Google Sign-In ---
        googleLoginBtn.addEventListener('click', () => {
            googleLoginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...';
            errorMessage.classList.add('hidden');

            signInWithPopup(auth, provider)
                .then((result) => {
                    // Success
                    const user = result.user;
                    localStorage.setItem('finai_user', JSON.stringify({ name: user.displayName, email: user.email }));
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    // Error
                    googleLoginBtn.innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Sign in with Google';
                    errorMessage.innerText = error.message;
                    errorMessage.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
