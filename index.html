<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinAI - Advanced Wealth Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen selection:bg-blue-200">

    <nav class="glass border-b border-slate-200 fixed w-full z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30 group-hover:scale-105 transition"><i class="fa-solid fa-layer-group text-white text-lg"></i></div>
                    <span class="font-extrabold text-2xl tracking-tight">FinAI<span class="text-blue-600">.</span></span>
                </a>
                <div class="hidden md:flex space-x-10 items-center">
                    <a href="index.html" class="text-blue-600 font-semibold">Home</a>
                    <a href="advisor.html" class="text-slate-600 hover:text-blue-600 font-medium transition">AI Advisor</a>
                    <a href="dashboard.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Dashboard</a>
                </div>
                <div class="flex items-center" id="navAuthArea">
                    <a href="login.html" class="text-slate-600 hover:text-slate-900 font-medium mr-6">Log in</a>
                    <a href="register.html" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-slate-800 transition shadow-lg shadow-slate-900/20">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <!-- Hero -->
        <div class="relative overflow-hidden bg-white">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
            <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-blue-100 blur-3xl opacity-50"></div>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-40 text-center relative z-10">
                <div class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-700 font-medium text-sm mb-10 shadow-sm">
                    <span class="flex h-2.5 w-2.5 rounded-full bg-green-500 animate-pulse"></span>
                    FinAI Engine v3.0 Online
                </div>
                <h1 class="text-6xl md:text-8xl font-extrabold tracking-tight text-slate-900 mb-8 leading-tight">
                    Smart investing, <br/>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">powered by AI.</span>
                </h1>
                <p class="mt-6 text-xl text-slate-500 max-w-3xl mx-auto mb-12 leading-relaxed">
                    Institutional-grade portfolio management, intelligent rebalancing, and personalized mutual fund advisory—now available for everyone.
                </p>
                <div class="flex justify-center gap-5">
                    <a href="register.html" class="bg-blue-600 text-white px-8 py-4 rounded-xl font-semibold text-lg hover:bg-blue-700 transition shadow-xl shadow-blue-600/30 flex items-center gap-2">
                        Start Investing Free <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check Auth State
        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('finai_user'));
            if(user) {
                document.getElementById('navAuthArea').innerHTML = `
                    <a href="dashboard.html" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">Go to Dashboard</a>
                `;
            }
        }
    </script>
</body>
</html>
